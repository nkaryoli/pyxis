<a
	href="{{ url_for('posts.post_respuesta', id_post=post.id_post) }}"
	class="block rounded-md border p-5 transition {% if post.is_deleted %}opacity-80 hover:opacity-100 border-dashed border-rose-500/50 bg-zinc-950/40{% else %}border-zinc-800 bg-zinc-900/80 hover:-translate-y-1 hover:border-cyan-500{% endif %}"
>
	<div class="flex items-start justify-between gap-4">
		<div>
			<p class="text-xs uppercase tracking-[0.3em] text-cyan-400">
				{{ post.modulo_nombre }}
			</p>
			<h3
				class="mt-2 text-lg font-semibold text-white group-hover:text-cyan-300"
			>
				{% if post.is_deleted %}
					<span class="inline-flex items-center gap-1 rounded bg-rose-500/10 px-1.5 py-0.5 text-[10px] font-bold text-rose-400 border border-rose-500/20 mr-1.5 uppercase">Inactivo</span>
				{% endif %}
				{{ post.titulo_post }}
			</h3>
		</div>
		{% if post.destacado %}
			<span class="rounded-full bg-amber-400/15 px-3 py-1 text-xs font-medium text-amber-300">
				Destacado
			</span
		>
		{% endif %}
	</div>
	<p class="mt-3 text-sm text-zinc-400 line-clamp-2">{{ post.contenido_post }}</p>
	<div class="mt-4 flex flex-wrap items-center gap-3 text-xs text-zinc-500">
		<span>{{ post.autor }}</span>
		<span>·</span>
		<span>{{ post.created_at.strftime('%d/%m/%Y') }}</span>
		<span>·</span>
		<span>{{ post.respuestas_count }} respuestas</span>
	</div>
</a>
