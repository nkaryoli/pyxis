<!doctype html>
<html>
<head><meta charset="utf-8"><title>Error</title></head>
<body>
	<h1>Error</h1>
	{% if mensaje %}
		<p>{{ mensaje }}</p>
	{% elif error %}
		<p>{{ error }}</p>
	{% else %}
		<p>Ha ocurrido un error inesperado.</p>
	{% endif %}

	{% if errors %}
		<ul>
		{% for e in errors %}
			<li>{{ e }}</li>
		{% endfor %}
		</ul>
	{% endif %}
</body>
</html>
