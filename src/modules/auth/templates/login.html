{% extends "base.html" %} {% block title %}Iniciar sesión | Pyxis{% endblock %}
{% block content %}
<div class="w-full max-w-md px-6">
	<div
		class="rounded-3xl border border-white/10 bg-zinc-950/95 p-8 shadow-2xl shadow-black/40 backdrop-blur"
	>
		<div class="mb-8 text-center">
			<p class="mb-2 text-sm uppercase tracking-[0.35em] text-emerald-400">
				Pyxis
			</p>
			<h1 class="text-3xl font-semibold text-white">Iniciar sesión</h1>
			<p class="mt-2 text-sm text-zinc-400">
				Accede con tu correo y contraseña
			</p>
		</div>

		{% if error %}
		<div
			class="mb-5 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-200"
		>
			{{ error }}
		</div>
		{% endif %}

		<form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
			<div>
				<label
					for="email_usuario"
					class="mb-2 block text-sm font-medium text-zinc-300"
				>
					Correo electrónico
				</label>
				<input
					id="email_usuario"
					name="email_usuario"
					type="email"
					required
					class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-white outline-none transition placeholder:text-zinc-500 focus:border-emerald-400/60 focus:ring-2 focus:ring-emerald-400/20"
					placeholder="tu.nombre@monlau.com"
				/>
			</div>

			<div>
				<label
					for="password_usuario"
					class="mb-2 block text-sm font-medium text-zinc-300"
				>
					Contraseña
				</label>
				<input
					id="password_usuario"
					name="password_usuario"
					type="password"
					required
					class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-white outline-none transition placeholder:text-zinc-500 focus:border-emerald-400/60 focus:ring-2 focus:ring-emerald-400/20"
					placeholder="••••••••"
				/>
			</div>

			<button
				type="submit"
				class="w-full rounded-xl bg-emerald-500 px-4 py-3 font-semibold text-black transition hover:bg-emerald-400"
			>
				Entrar
			</button>
		</form>

		<p class="mt-6 text-center text-sm text-zinc-400">
			¿No tienes cuenta?
			<a
				href="{{ url_for('auth.register') }}"
				class="font-medium text-emerald-400 hover:text-emerald-300"
				>Crear cuenta</a
			>
		</p>
	</div>
</div>
{% endblock %}
