<dialog id="modal-usuario" class="fixed inset-0 m-auto w-full max-w-md rounded-lg border border-cyan-400/20 bg-zinc-950/95 p-8 shadow-2xl shadow-cyan-500/20 backdrop:bg-black/60 backdrop:backdrop-blur-sm outline-none overflow-visible">
	<button type="button" id="btn-cancelar-modal-top" class="absolute right-1 top-1 cursor-pointer rounded-sm bg-zinc-900/5 px-2 py-1 text-sm  text-zinc-300 transition hover:bg-white/5 hover:text-cyan-500">
		x
	</button>
	<form method="dialog" id="form-usuario" class="relative space-y-4">
		<input type="hidden" id="modal-user-id" />
		
		<div class="mb-6">
			<h2 id="modal-titulo" class="text-2xl font-medium text-white">---</h2>
		</div>

		<div>
			<label for="modal-email" class="mb-2 block text-sm font-medium text-white">Correo electrónico</label>
			<input id="modal-email" type="email" required class="text-sm w-full rounded-sm border border-cyan-400/20 bg-white/5 px-4 py-2 text-white outline-none transition placeholder:text-zinc-500 focus:border-cyan-300 focus:ring-2 focus:ring-cyan-400/20" placeholder="nombre@monlau.com" />
		</div>
		
		<div class="w-full flex gap-3 pb-3" id="modal-pass-rol-container">
			<div class="w-full" id="modal-pass-wrapper">
				<label id="label-password" for="modal-password" class="mb-2 block text-sm font-medium text-white">Contraseña</label>
				<input id="modal-password" type="password" required class="w-full text-sm rounded-sm border border-cyan-400/20 bg-white/5 px-4 py-2 text-white outline-none transition placeholder:text-zinc-500 focus:border-cyan-300 focus:ring-2 focus:ring-cyan-400/20" placeholder="••••••••" />
			</div>
			<div class="w-full relative" id="modal-rol-wrapper">
				<label class="mb-2 block text-sm font-medium text-white">Rol del usuario</label>
				<button type="button" id="btn-custom-rol" class="w-full flex items-center justify-between rounded-sm border text-sm border-cyan-400/20 bg-zinc-900 px-4 py-2 text-white outline-none focus:border-cyan-300 focus:ring-2 focus:ring-cyan-400/20 transition cursor-pointer">
					<span id="custom-rol-value">Alumno</span>
					<svg class="w-4 h-4 text-zinc-400 animate-pulse" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7"></path>
					</svg>
				</button>
				<input type="hidden" id="modal-rol" value="ALUMNO" />
				<div id="custom-rol-options" class="hidden absolute left-0 z-50 mt-1 w-full rounded border border-cyan-500/20 bg-zinc-950 p-1 shadow-2xl">
					<div data-val="ALUMNO" class="rol-option cursor-pointer rounded px-3 py-2 text-xs text-white hover:bg-zinc-900 hover:text-cyan-400 transition">Alumno</div>
					<div data-val="PROFESOR" class="rol-option cursor-pointer rounded px-3 py-2 text-xs text-white hover:bg-zinc-900 hover:text-cyan-400 transition">Profesor</div>
					<div data-val="ADMINISTRADOR" class="rol-option cursor-pointer rounded px-3 py-2 text-xs text-white hover:bg-zinc-900 hover:text-cyan-400 transition">Administrador</div>
				</div>
			</div>
		</div>
		
		<div class="flex items-center justify-end gap-3 border-zinc-600 mt-6">
			<button type="button" id="btn-cancelar-modal" class="cursor-pointer rounded-sm border border-red-500/80 bg-transparent px-4 py-2 text-sm font-medium text-red-500/80 transition hover:bg-red-300/5 hover:border-red-600 hover:text-red-600">
				Cancelar
			</button>
			<button type="submit" id="btn-guardar-modal" class="cursor-pointer rounded-sm bg-cyan-500 px-5 py-2 text-sm font-semibold text-black transition hover:bg-cyan-400">
				Guardar
			</button>
		</div>
	</form>
</dialog>
